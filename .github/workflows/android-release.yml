name: Android release APK
run-name: Android release APK from migration

on:
  push:
    branches:
      - migration

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: pulse-android
    steps:
      - name: Check required secrets
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_SIGNING_PROPERTIES_BASE64 TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Restore release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          umask 077
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/pulse-release.p12
          printf '%s' "$ANDROID_SIGNING_PROPERTIES_BASE64" | base64 --decode > .signing/release.properties
          # Override any local machine path while preserving the existing passwords and alias.
          printf '\nstoreFile=.signing/pulse-release.p12\n' >> .signing/release.properties
          test -s .signing/pulse-release.p12
          test -s .signing/release.properties

      - name: Build signed release APK
        env:
          PULSE_RELEASE_API_URL: ${{ vars.PULSE_RELEASE_API_URL }}
        run: |
          args=()
          if [[ -n "$PULSE_RELEASE_API_URL" ]]; then
            args+=("-Ppulse.releaseApiUrl=$PULSE_RELEASE_API_URL")
          fi
          bash ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease "${args[@]}"

      - name: Verify APK signature and prepare download
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release-output
          source_sha=$(git rev-parse HEAD)
          filename="pulse-release-${source_sha:0:7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          cp "$apk" "release-output/$filename"
          sha256sum "release-output/$filename" | tee "release-output/$filename.sha256"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "commit=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Save APK on GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pulse-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: pulse-android/release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILENAME: ${{ steps.apk.outputs.filename }}
          BUILT_COMMIT: ${{ steps.apk.outputs.commit }}
        run: |
          apk="release-output/$APK_FILENAME"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if (( $(stat -c%s "$apk") > 50000000 )); then
            echo '::error::APK exceeds the Telegram Bot API 50 MB upload limit. Download the APK from this run’s GitHub artifact.'
            exit 1
          fi
          caption=$(printf 'Pulse release APK\nBranch: migration\nCommit: %s\nBuild: %s (attempt %s)\n%s' "$BUILT_COMMIT" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$run_url")
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/telegram-response.json" \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=$caption" \
            --form "document=@$apk;type=application/vnd.android.package-archive" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'telegram-response.json').read_text())
          if not result.get('ok'):
              raise SystemExit('Telegram rejected the APK upload; check bot permissions and chat ID.')
          print('APK delivered to Telegram.')
          PY
          printf 'Signed APK delivered to Telegram. A backup is available in this run’s artifacts for 14 days.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing files
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -f pulse-android/.signing/pulse-release.p12 pulse-android/.signing/release.properties
