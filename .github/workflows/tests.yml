name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit:
    name: Pulse Android (unit tests and checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pulse-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests in every module, Android lint, and Kotlin formatting checks
        run: ./gradlew --no-daemon --stacktrace --continue test lint ktlintCheck
      - name: Upload unit test and check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pulse-android-unit-reports
          path: |
            pulse-android/**/build/reports/
            pulse-android/**/build/test-results/

  android-ui:
    name: Pulse Android (UI and device tests)
    runs-on: ubuntu-24.04
    # The test command has a shorter deadline so diagnostics can upload first.
    timeout-minutes: 90
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    defaults:
      run:
        working-directory: pulse-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and device test APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install Maestro for Android smoke tests
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Run Android instrumentation tests
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Use ANGLE's software backend for the Linux emulator.
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: pulse-android
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ../scripts/run-android-instrumentation.sh
      - name: Run Maestro smoke tests on a fresh emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep instrumentation processes and display overrides out of Maestro's device.
          avd-name: pulse-maestro-smoke
          force-avd-creation: true
          emulator-port: 5554
          # Drop transports left by the instrumentation emulator before starting this one.
          pre-emulator-launch-script: adb kill-server
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: pulse-android
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ../scripts/run-android-maestro.sh
      - name: Upload device test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pulse-android-device-reports
          path: |
            pulse-android/**/build/reports/androidTests/
            pulse-android/**/build/outputs/androidTest-results/
            pulse-android/build/reports/device-environment/
            pulse-android/build/reports/maestro/

  go:
    name: Go backend (unit and integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Check Docker for database tests
        run: docker info
      - name: Run all Go tests with race detection
        run: go test -race -count=1 -shuffle=on -tags=integration -timeout=20m ./...

  rust:
    name: Rust backend (unit and database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository's Rust toolchain
        run: rustup show
      - name: Check Docker for database tests
        run: docker info
      - name: Run all Rust tests, including database tests
        run: cargo test --locked --workspace --all-features
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Rust lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: life-tracker-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: life-tracker-frontend/package-lock.json
      - run: npm ci
      - name: Run all frontend tests
        run: npm test
      - name: Type-check and build the production app
        if: ${{ !cancelled() }}
        run: npm run build

  hermes:
    name: Hermes MCP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hermes-mcp/requirements.txt
      - run: python -m pip install -r hermes-mcp/requirements.txt
      - name: Run all Hermes MCP tests
        run: python -m unittest discover -v -s hermes-mcp -p 'test_*.py'
      - name: Check the combined test reporter
        run: python -m unittest discover -v -s scripts -p 'test_test_report.py'
      - name: Check Android instrumentation timeout and diagnostics
        run: python -m unittest discover -v -s scripts -p 'test_android_instrumentation.py'
      - name: Check Maestro workflow command execution
        run: python -m unittest discover -v -s scripts -p 'test_android_maestro.py'
      - name: Run seed exporter tests
        run: python -m unittest discover -v -s scripts -p 'test_export_dev_seed.py'

  seed-database:
    name: Development seed database checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify seed restore, repeat runs, and populated database protection
        env:
          TEST_SEED_DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse_test?sslmode=disable
        run: python -m unittest discover -v -s scripts -p 'test_seed_database.py'
