name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go backend (unit and integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Check Docker for database tests
        run: docker info
      - name: Run all Go tests with race detection
        run: go test -race -count=1 -shuffle=on -tags=integration -timeout=20m ./...

  rust:
    name: Rust backend (unit and database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository's Rust toolchain
        run: rustup show
      - name: Check Docker for database tests
        run: docker info
      - name: Run all Rust tests, including database tests
        run: cargo test --locked --workspace --all-features

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: life-tracker-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: life-tracker-frontend/package-lock.json
      - run: npm ci
      - name: Run all frontend tests
        run: npm test
      - name: Type-check and build the production app
        if: ${{ !cancelled() }}
        run: npm run build

  hermes:
    name: Hermes MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hermes-mcp/requirements.txt
      - run: python -m pip install -r hermes-mcp/requirements.txt
      - name: Run all Hermes MCP tests
        run: python -m unittest discover -v -s hermes-mcp -p 'test_*.py'
      - name: Run seed exporter tests
        run: python -m unittest discover -v -s scripts -p 'test_export_dev_seed.py'

  browser:
    name: Maestro browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: development
      DB_HOSTNAME: localhost
      DB_PORT: 5432
      DB_NAME: pulse_test
      DB_USERNAME: pulse
      DB_PASSWORD: pulse
      DB_SSLMODE: disable
      INTERNAL_API_BASE_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: life-tracker-frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify seed restore, repeat runs, and populated database protection
        env:
          TEST_SEED_DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse_test?sslmode=disable
        run: python -m unittest discover -v -s scripts -p 'test_seed_database.py'
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Build the Go API and migrate the disposable database
        working-directory: go-backend
        run: |
          go build -o "$RUNNER_TEMP/pulse-api" ./cmd/api
          "$RUNNER_TEMP/pulse-api" --migrate-up
      - name: Load the anonymized development snapshot
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -X -U pulse -d pulse_test -v seed_environment=test < go-backend/data/dev-seed.sql
      - name: Install and build the frontend
        working-directory: life-tracker-frontend
        run: |
          npm ci
          npm run build
      - name: Start the API and frontend
        run: |
          (cd go-backend && "$RUNNER_TEMP/pulse-api") > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd life-tracker-frontend && npm start) > "$RUNNER_TEMP/frontend.log" 2>&1 &
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 90 http://localhost:8080/readyz
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 90 http://localhost:3000
      - name: Run every Maestro flow
        run: maestro test --headless maestro/
      - name: Print server logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/frontend.log"; do
            if [ -f "$log" ]; then cat "$log"; fi
          done
