services:
  migrate-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
    command: ["--migrate-up"]
    restart: "no"

  seed-dev:
    profiles: ["dev"]
    image: postgres:17.6
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
    environment:
      PGHOST: ${DB_HOSTNAME}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      PGSSLMODE: ${DB_SSLMODE:-require}
      STATEMENT_TEST_PASSWORD: ${STATEMENT_TEST_PASSWORD:-}
    volumes:
      - ${PULSE_DEV_SEED_FILE:-./go-backend/data/dev-seed.sql}:/seed.sql:ro
    command: ["psql", "-X", "-v", "seed_environment=development", "-f", "/seed.sql"]
    restart: "no"

  backend-dev:
    profiles: ["dev"]
    depends_on:
      statement-extractor:
        condition: service_healthy
      seed-dev:
        condition: service_completed_successfully
    image: golang:1.26.10-bookworm
    user: "0:0"
    entrypoint: []
    working_dir: /app
    command: >
      sh -lc '
        /usr/local/go/bin/go version &&
        if [ ! -x /go/bin/air ]; then GOBIN=/go/bin /usr/local/go/bin/go install github.com/air-verse/air@v1.61.5; fi &&
        /go/bin/air -c .air.toml
      '
    volumes:
      - ./go-backend:/app
      - ./release.json:/release.json:ro
      - go_build_cache:/go/pkg/mod
      - go_tools:/go/bin
    environment:
      APP_ENV: development
      PORT: 8080
      STATEMENT_EXTRACTOR_URL: ${STATEMENT_EXTRACTOR_URL:-http://statement-extractor:8090}
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      CORS_ALLOWED_ORIGINS: http://localhost:3102
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${PULSE_DEV_GO_BIND:-127.0.0.1:18081}:8080"
    networks:
      statement-extraction: {}
      default:
        aliases:
          - backend-api

  rust-backend-dev:
    profiles: ["dev"]
    depends_on:
      seed-dev:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: rust-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOSTNAME}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${RUST_DB_SSLMODE:-disable}
      PORT: ${RUST_PORT:-8083}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      default:
        aliases:
          - rust-backend-api
    ports:
      - "${PULSE_DEV_RUST_BIND:-127.0.0.1:18084}:${RUST_PORT:-8083}"
    restart: unless-stopped

  cloudflared-dev:
    profiles: ["dev"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://rust-backend-dev:${RUST_PORT:-8083}
    depends_on:
      - rust-backend-dev
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -lc "(npm ci || npm i) && npm run dev:docker"
    volumes:
      - ./life-tracker-frontend:/app
      - ./release.json:/release.json:ro
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    environment:
      NODE_ENV: development
      PORT: 3000
      INTERNAL_API_BASE_URL: http://backend-dev:8080
      # Windows bind mounts may not forward file events into the Linux container.
      # This is consumed by Webpack/Watchpack (not Turbopack).
      WATCHPACK_POLLING: "1000"
    ports:
      - "${PULSE_DEV_WEB_BIND:-3102}:3000"
    depends_on:
      - backend-dev

  alloy:
    environment:
      LOG_ENVIRONMENT: development

  prometheus:
    ports: !override
      - "${PULSE_DEV_PROMETHEUS_BIND:-127.0.0.1:19090}:9090"

  grafana:
    ports: !override
      - "${PULSE_DEV_GRAFANA_BIND:-127.0.0.1:3103}:3000"

  jaeger:
    ports: !override
      - "${PULSE_DEV_JAEGER_BIND:-127.0.0.1:16687}:16686"

  statement-test-db:
    profiles: ["statement-test"]
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  statement-corpus:
    profiles: ["statement-test"]
    image: python:3.12-slim-bookworm
    command: ["python", "/runner.py"]
    environment:
      STATEMENT_TEST_PASSWORD: ${STATEMENT_TEST_PASSWORD:-}
      STATEMENT_API_BASE: http://backend-dev:8080
    volumes:
      - ./scripts/statement-corpus-runner.py:/runner.py:ro
      - ${CORPUS_DIR:-./tests/statement-import/fixtures}:/corpus:ro

volumes:
  go_build_cache:
  web_node_modules:
  web_next_cache:
  go_tools:
