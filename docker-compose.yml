services:
  migrate:
    profiles: ["prod"]
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: life-migrate
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
    command: ["--migrate-up"]
    restart: "no"

  backend:
    profiles: ["prod"]
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: life-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      PORT: 8080
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    profiles: ["prod"]
    build:
      context: ./life-tracker-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY}
    container_name: life-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_INTERNAL_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 15

  bot:
    profiles: ["prod"]
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: life-bot
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BOT_API_KEY: ${BOT_API_KEY}
      BACKEND_BASE_URL: http://backend:8080
    restart: unless-stopped
