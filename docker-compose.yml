services:
  migrate:
    profiles: ["prod"]
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
    command: ["--migrate-up"]
    restart: "no"

  backend:
    profiles: ["prod"]
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      PORT: 8080
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    networks:
      default:
        aliases:
          - backend-api
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

  rust-backend:
    profiles: ["prod"]
    build:
      context: ./rust-backend
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOSTNAME}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${RUST_DB_SSLMODE:-disable}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN for the Rust backend}
      PORT: ${RUST_PORT:-8083}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:18083:${RUST_PORT:-8083}"
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build:
      context: ./life-tracker-frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_BASE_URL: http://backend:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3100:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 15

  bot:
    profiles: ["prod"]
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BOT_API_KEY: ${BOT_API_KEY}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?Set your numeric Telegram user ID}
      BACKEND_BASE_URL: http://backend:8080
    restart: unless-stopped

  mcp:
    profiles: ["prod"]
    build: ./hermes-mcp
    depends_on:
      backend:
        condition: service_healthy
    environment:
      LIFE_BACKEND_BASE_URL: http://backend:8080
    ports:
      - "127.0.0.1:18082:8000"
    restart: unless-stopped

  prometheus:
    profiles: ["prod", "dev"]
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"

  grafana:
    profiles: ["prod", "dev"]
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set a Grafana admin password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    profiles: ["prod", "dev"]
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
