info:
  contact: {}
  description: REST API for the Life Backend application. Session endpoints accept
    a Bearer token in Authorization, X-Session-Token, or the life_session cookie;
    login sets the cookie.
  title: Life Backend API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Sets the life_session HTTP-only cookie.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apidoc.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.Username'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      summary: Log in
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clears the session cookie and invalidates a supplied session token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      summary: Log out
      tags:
      - auth
  /api/auth/session:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.Username'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Get current session
      tags:
      - auth
  /api/gym-visits:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidoc.GymVisit'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: List gym visits
      tags:
      - gym
    post:
      consumes:
      - application/json
      parameters:
      - description: Workout date
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apidoc.GymVisitDateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apidoc.CreatedID'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Record a workout visit on an India calendar date
      tags:
      - gym
  /api/gym-visits/{id}:
    delete:
      parameters:
      - description: Positive id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Delete gym visit
      tags:
      - gym
    get:
      parameters:
      - description: Positive id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.GymVisitDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Get workout visit details with linked fitness metrics
      tags:
      - gym
  /api/gym-visits/{id}/exercises:
    get:
      parameters:
      - description: Positive id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidoc.Exercise'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: List visit exercises
      tags:
      - gym
    post:
      consumes:
      - application/json
      parameters:
      - description: Positive id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apidoc.ExerciseInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apidoc.Exercise'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Add visit exercise
      tags:
      - gym
  /api/gym-visits/{id}/exercises/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: Positive id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apidoc.ExerciseBatchInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/apidoc.Exercise'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - SessionBearer: []
      summary: Add multiple visit exercises
      tags:
      - gym
  /api/horizon:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/horizon.SummaryDTO'
        "401":
          description: Unauthorized
