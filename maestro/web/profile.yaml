url: http://localhost:3000
---
- launchApp:
    clearState: true

# 1. Login
- assertVisible: Welcome back
- tapOn:
    css: "#username"
- eraseText
- inputText: admin
- tapOn:
    css: "#password"
- inputText: password
- tapOn: Continue

# 2. Dashboard
- assertVisible: "Good to see you,"
- assertVisible:
    css: "section[aria-label='Welcome'] h1"

# 3. Tap profile icon in top right corner
- tapOn:
    id: "Profile"

# 4. Verify Profile page
- assertVisible: "Personal Profile"
- assertVisible: "Account Information"

# Theme selection must carry back to the dashboard's shared palette.
- scrollUntilVisible:
    element: "Light"
    direction: DOWN
- tapOn: "Light"
- scrollUntilVisible:
    element: '\s*Dashboard\s*'
    direction: UP
- tapOn: '\s*Dashboard\s*'
- assertVisible:
    css: "html:not(.dark) section[aria-label='Welcome'] h1"
- tapOn:
    id: "Profile"
- scrollUntilVisible:
    element: "Dark"
    direction: DOWN
- tapOn: "Dark"
- scrollUntilVisible:
    element: '\s*Dashboard\s*'
    direction: UP
- tapOn: '\s*Dashboard\s*'
- assertVisible:
    css: "html.dark section[aria-label='Welcome'] h1"
