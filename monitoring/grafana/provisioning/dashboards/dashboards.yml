apiVersion: 1

providers:
  # Keep the provider identity so existing provisioned dashboards remain managed.
  - name: "life-backend"
    orgId: 1
    folder: "PULSE"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
