global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "go-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend-api:8080"
        labels:
          service: "Go backend"
  - job_name: "rust-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "rust-backend-api:9091"
        labels:
          service: "Rust backend"
