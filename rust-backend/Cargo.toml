[package]
name = "pulse-rust-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
strip = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tower-log", "tracing"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
dotenvy = "0.15.7"
hex = "0.4.3"
prometheus = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "derive", "chrono", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "process"] }
